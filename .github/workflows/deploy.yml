name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # alle 6 Stunden den Kalender neu abrufen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Geokodier-Ergebnisse zwischen den Läufen behalten (schont Nominatim)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-
      - run: npm ci
      - run: npm run build
        env:
          # Optional: überschreibt calendarIcsUrl aus site.config.json,
          # z. B. mit der geheimen iCal-Adresse eines nicht-öffentlichen Kalenders.
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
